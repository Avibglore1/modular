<!-- todo list -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;    
            flex-direction: column;
            height: 100vh;
            background-color: greenyellow;
            gap: 20px;
        }

        .container{
            display: flex;
            flex-direction: column;
           
           padding: 8px;
            border-radius: 10px;
        }

        input{
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 20px;
        }

        ul{
            display: flex;
            flex-direction: column;
            
            list-style: none;
        }

        li{
            padding: 7px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 20px;
            background-color: yellow;
            width: 300px;
            margin-left: -40px;
           margin-top: -18px;
        }

        button{
            padding: 5px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 20px;
            background-color: greenyellow;
            width: 50px;
            margin-left: 10px;
        }

        .checked{
            text-decoration: line-through;
            color: gray;
            cursor: pointer;
            opacity: 0.4;
        }

       
    </style>
 </head>
 <body>

    <div class="container">
        <input type="text" placeholder="Enter your to-do" id="todo">
        <ul id="todoList">
            
        </ul>
    </div>

    <script>

         let inputEl = document.querySelector("input");
         inputEl.addEventListener("keypress", function(e){
            if(e.key === "Enter"){
                let text = e.target.value;
                let liEl = document.createElement("li");
                document.querySelector("ul").appendChild(liEl);

                let innerDivEl = document.createElement("div");
                liEl.appendChild(innerDivEl);

                let spanEl = document.createElement("span");
                spanEl.textContent = text;
                innerDivEl.appendChild(spanEl);

                let btnContainer = document.createElement("div");
                innerDivEl.appendChild(btnContainer);

                let checkedBtn = document.createElement("button");
                checkedBtn.textContent = "✅";
                btnContainer.appendChild(checkedBtn);

                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "❌";
                btnContainer.appendChild(deleteBtn);

                innerDivEl.style.display = "flex";
                innerDivEl.style.justifyContent = "space-between";
                innerDivEl.style.alignItems = "center";


                checkedBtn.addEventListener("click", function(){
                    liEl.classList.toggle("checked")
                    
                })

                deleteBtn.addEventListener("click", function(){
                    liEl.remove();
                })
                inputEl.value = "";
                
            }
         })
    </script>
 </body>
 </html>
