<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        .container{
            background-color: rgb(183, 58, 58);
            width: 30%;
            height: 40vh;
            margin: 100px auto;
            border: 5px solid rgb(125, 142, 125);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            box-shadow: inset 30%;
            gap: 10px;
            color: white;
        }
        input{
            height: 25px;
            width: 50%;
            padding: 5px;
            border-radius: 8px;
            border-style: none;
            font-size: 20px;
        }
        button{
            height: 30px;
            width: 50%;
            padding: 5px;
            border-radius: 8px;
            border-style: none;
            font-size: 20px;
            background-color: rgb(59, 59, 215);
            color: white;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>Age Calculator</h1>
        <h3>Enter your birthdate</h3>
        <input type="date" id="birthdate">
        <button id="calculate">Calculate</button>
        <p id="result"></p>
    </div>
    <script>
        let dateEl = document.querySelector("input");
        let btnEl = document.querySelector("button");
        let date,dobYear,currentYear,age;
        let paraEl = document.querySelector("p");

        dateEl.addEventListener("input", ()=>{
            date = dateEl.value;
            dobYear = new Date(date).getFullYear();
            currentYear = new Date().getFullYear();
            age = currentYear - dobYear;         
        })
        btnEl.addEventListener("click", function(){
            if(age<0 || age===undefined){
                paraEl.textContent = `Please enter a valid birthdate`;
                paraEl.style.color = "red";
            }else{
                paraEl.textContent = `You are ${age} years old`;
                paraEl.style.color = "green"
            }
            
        })

    </script>
</body>
</html>
