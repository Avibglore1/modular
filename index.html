<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        body{
            background-color: rgb(223, 212, 212);
            display: flex;
            justify-content: center;
            
        }
        .container{
            text-align: center;
            padding-top: 10px;
            font-size: 20px;
            background-color: white;
            height: 300px;
            width: 300px;
            margin-top: 50px;
            border-radius: 8px;
            box-shadow: 3px 3px 1px black   ;
        }
        input{
            padding: 5px;
            margin: 10px;
            width: 80%;
            border-radius: 8px;
            text-align: center;
        }
        button{
            padding: 10px 20px;
            margin: 10px;
            background-color: rgb(61, 61, 201);
            border-radius: 8px;
            color: white;
            border: none;
        }
        h2{
            padding: 5px;
            margin: 5px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Age Calculator</h1>
        <p><b>Enter your date of Birth</b></p>
        <input type="date" name="" id="">
        <button>Calculate Age</button>
        <h2></h2>
    </div>
    <script>
        let date, yearOfBirth, currentYear,age;
        let dateEl = document.querySelector("input");
        let btnEl = document.querySelector("button");
        let resultEl = document.querySelector("h2");
        dateEl.addEventListener("input", function(){
            date = dateEl.value;
            yearOfBirth = new Date(date).getFullYear();
            currentYear = new Date().getFullYear();
            age = currentYear - yearOfBirth;
        })
        btnEl.addEventListener("click", function(){
            if(age===undefined){
                resultEl.textContent = `Please enter your date of birth`
                return;
            }
            resultEl.textContent = `You are ${age} years old`
        })

    </script>
</body>
</html>
