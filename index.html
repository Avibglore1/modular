<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        *{margin: 0;padding: 0;box-sizing: border-box;}
        body{
            background-color: greenyellow;
            display: flex;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
        }
        input{
            margin-top: 200px;
        
            padding: 20px;
            width: 20%;
            height: 50px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 20px;
        }
        input:focus{
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <input type="text" name="" id="" placeholder="Enter your task">
    <ul>

    </ul>
    <script>
        let inputEl = document.querySelector("input");
        inputEl.addEventListener("keypress", function(event){            
            if(event.key==="Enter"){
                let task = document.createElement("li");
                let taskContainer = document.createElement("div");
                let btn = document.createElement("button");
                let imgEl = document.createElement("img");
                imgEl.src= "./bin.png";
                imgEl.style.height="20px";
                imgEl.style.width="20px";
                let span = document.createElement("span");
                span.innerText=inputEl.value;
                let innerDivEl = document.createElement("div");
                btn.appendChild(imgEl);
                innerDivEl.appendChild(span);
                innerDivEl.appendChild(btn);
                taskContainer.appendChild(innerDivEl);
                taskContainer.style.display="flex";
                taskContainer.style.justifyContent="space-evenly";
                taskContainer.style.alignItems="center";
                taskContainer.style.padding="10px";
                taskContainer.style.border="1px solid rgb(255, 255, 255)";
                taskContainer.style.borderRadius="10px";
                taskContainer.style.margin="10px";
                taskContainer.style.width="300px";
                taskContainer.style.height="50px";
                taskContainer.style.fontSize="20px";
               
                
                
                task.appendChild(taskContainer);  
                document.querySelector("ul").appendChild(task);  
                inputEl.value = "";
            }
        })
    </script>
</body>
</html>
