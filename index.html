<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        *{margin: 0;padding: 0;box-sizing: border-box;}
        body{
            background-color: greenyellow;
            display: flex;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            font-family: 'Poppins', sans-serif;
        }
        input{
            margin-top: 200px;
            padding: 20px;
            width: 20%;
            height: 50px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 20px;
        }
        input:focus{
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            border: 2px solid black;
        }
        .checked{
            text-decoration: line-through;
            color: red;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <input type="text" name="" id="" placeholder="Enter your task">
    <ul>

    </ul>
    <script>
        let inputEl = document.querySelector("input");
        inputEl.addEventListener("keypress", function(event){            
            if(event.key==="Enter" && inputEl.value.trim()!== ""){
                let task = document.createElement("li");
                let taskContainer = document.createElement("div");
                let deleteBtn = document.createElement("button");
                let checkedBtn = document.createElement("button");
                checkedBtn.innerHTML = "✅";
                let imgEl = document.createElement("img");
                imgEl.src= "./bin.png";
                imgEl.style.height="12px";
                imgEl.style.width="12px";
                let span = document.createElement("span");
                span.innerText=inputEl.value;
                let innerDivEl = document.createElement("div");
                innerDivEl.style.display="flex";
                innerDivEl.style.alignItems="center";
                innerDivEl.style.justifyContent="space-between";
                innerDivEl.style.gap="5px";
                deleteBtn.style.background="transparent";
                deleteBtn.style.border="none";
                deleteBtn.style.cursor="pointer";
                deleteBtn.style.display="flex";
                deleteBtn.style.alignItems="center";
                deleteBtn.style.justifyContent="center";
                deleteBtn.onclick=function(){
                    task.remove();
                }
                checkedBtn.style.background="transparent";
                checkedBtn.style.border="none";
                checkedBtn.style.cursor="pointer";
                checkedBtn.onclick=function(){
                    span.classList.toggle("checked");
                    checkedBtn.style.opacity = "0.5";
                }
                deleteBtn.appendChild(imgEl);
                innerDivEl.appendChild(checkedBtn);
                taskContainer.appendChild(span);
                innerDivEl.appendChild(deleteBtn);
                taskContainer.appendChild(innerDivEl);
                taskContainer.style.display="flex";
                taskContainer.style.justifyContent="space-between";
                taskContainer.style.alignItems="center";
                taskContainer.style.padding="10px";
                taskContainer.style.border="2px dotted rgb(255, 255, 255)";
                taskContainer.style.borderRadius="10px";
                taskContainer.style.margin="10px";
                taskContainer.style.width="300px";
                taskContainer.style.height="50px";
                taskContainer.style.fontSize="20px";
                task.style.listStyleType="none";
                task.style.display="flex";
                task.style.alignItems="center";
                task.style.justifyContent="center";
                
                
                task.appendChild(taskContainer);  
                document.querySelector("ul").appendChild(task);  
                inputEl.value = "";
            }
        })
    </script>
</body>
</html>
